name: CI

# Push on every branch. Docs-only commits do not start a run. There is no
# pull_request trigger: the branch push is the run.
on:
  push:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      only_testing:
        description: >-
          Optional comma-separated UI test identifiers, e.g.
          mdviewUITests/ReaderAccessibilityTests/testLinkInHeadingStillOpens. When set, lint and unit tests are
          skipped and the simulator step runs only these tests. Empty runs everything.
        required: false
        default: ""

# Keyed on the ref so a newer push cancels the run already in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  build-and-test:
    name: lint, device build, simulator launch
    runs-on: macos-26
    # The UI test step alone takes about 20 minutes on the hosted macos-26 runner.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          set -euo pipefail
          # macos-26 ships Xcode 26.6 as the default, with the iOS 26 SDK and a
          # matching simulator runtime. iOS 26 satisfies the iOS 18 deployment target.
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          xcodebuild -showsdks
          sdk_major="$(xcodebuild -showsdks | sed -n 's/.*-sdk iphoneos\([0-9][0-9]*\).*/\1/p' | head -1)"
          if [ -z "${sdk_major}" ] || [ "${sdk_major}" -lt 18 ]; then
            echo "error: selected Xcode has no iOS 18+ SDK (got '${sdk_major:-none}')" >&2
            exit 1
          fi
          xcodebuild -runFirstLaunch

      - name: Cache SwiftPM and DerivedData
        uses: actions/cache@v6
        with:
          path: |
            .derivedData
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            Packages/MDCore/.build
          key: ${{ runner.os }}-xcode-26.6-${{ hashFiles('**/Package.resolved', 'Packages/MDCore/Package.swift', 'project.yml') }}
          restore-keys: |
            ${{ runner.os }}-xcode-26.6-

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Choose simulator destination
        id: simulator
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess, sys

          sdk = subprocess.check_output(["xcodebuild", "-showsdks"], text=True)
          versions = [(int(major), int(minor)) for major, minor in re.findall(r"-sdk iphonesimulator(\d+)\.(\d+)", sdk)]
          if not versions:
              sys.exit("error: selected Xcode has no iOS Simulator SDK")
          major, minor = max(versions)
          runtime_suffix = f"iOS-{major}-{minor}"

          raw = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"], text=True)
          devices_by_runtime = json.loads(raw).get("devices", {})
          matches = []
          for runtime, devices in devices_by_runtime.items():
              if not runtime.endswith(runtime_suffix):
                  continue
              for device in devices:
                  if device.get("isAvailable") is False:
                      continue
                  name = device.get("name", "")
                  if name.startswith("iPhone"):
                      matches.append(device)

          chosen = next((device for device in matches if device.get("name") == "iPhone 17"), None)
          if chosen is None and matches:
              chosen = sorted(matches, key=lambda device: device.get("name", ""))[0]
          if chosen is None:
              print(f"error: no iPhone simulator for runtime {runtime_suffix}", file=sys.stderr)
              for runtime in sorted(devices_by_runtime):
                  print(runtime, file=sys.stderr)
              sys.exit(1)

          destination = f"platform=iOS Simulator,id={chosen['udid']}"
          print(f"simulator: {chosen['name']} ({chosen['udid']}) on {runtime_suffix}")
          print(f"MDVIEW_IOS_DESTINATION={destination}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"destination={destination}\n")
          PY

      # The runner image's Homebrew SwiftFormat is older (0.63 or earlier) and formats differently from 0.64, so
      # lint disagreed with local runs. Install the release the Makefile pins (SWIFTFORMAT_VERSION), checksum-verified,
      # ahead of the preinstalled one on PATH.
      - name: Install pinned SwiftFormat
        env:
          SWIFTFORMAT_VERSION: "0.64.1"
          SWIFTFORMAT_SHA256: 0e5762a848d738602c7a983b26812031e634d85e357db070968b9c805f253eff
        run: |
          set -euo pipefail
          pinned="$(sed -n 's/^SWIFTFORMAT_VERSION = //p' Makefile)"
          if [ "${pinned}" != "${SWIFTFORMAT_VERSION}" ]; then
            echo "error: ci.yml pins SwiftFormat ${SWIFTFORMAT_VERSION} but the Makefile pins ${pinned}" >&2
            exit 1
          fi
          dir="${RUNNER_TEMP}/swiftformat"
          mkdir -p "${dir}"
          curl -fsSL --retry 3 -o "${dir}/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          echo "${SWIFTFORMAT_SHA256}  ${dir}/swiftformat.zip" | shasum -a 256 -c -
          unzip -o -q "${dir}/swiftformat.zip" -d "${dir}"
          chmod +x "${dir}/swiftformat"
          echo "${dir}" >> "${GITHUB_PATH}"
          "${dir}/swiftformat" --version

      - name: Lint
        if: ${{ github.event.inputs.only_testing == '' || github.event.inputs.only_testing == null }}
        run: |
          set -euo pipefail
          swiftformat --version
          make lint

      - name: Test
        if: ${{ github.event.inputs.only_testing == '' || github.event.inputs.only_testing == null }}
        env:
          # MDCore perf budgets use 6x instead of 3x on this slower shared runner (see PerformanceTests.swift).
          MDVIEW_HOSTED_CI: "1"
        run: make test

      - name: Simulator launch test
        env:
          CI: "true"
          # The Makefile default is iPhone 16. That device is not installed on
          # the macos-26 image; use the simulator chosen above.
          MDVIEW_IOS_DESTINATION: ${{ steps.simulator.outputs.destination }}
          # xcodebuild hands TEST_RUNNER_* to the UI test runner without the prefix. Tests that hit a limit of the
          # hosted runner, not of the app, skip on MDVIEW_HOSTED_CI and say why.
          TEST_RUNNER_MDVIEW_HOSTED_CI: "1"
          ONLY_TESTING: ${{ github.event.inputs.only_testing }}
        run: |
          set -euo pipefail
          args=""
          if [ -n "${ONLY_TESTING:-}" ]; then
            IFS=',' read -ra tests <<< "${ONLY_TESTING}"
            for test in "${tests[@]}"; do
              test="$(echo "${test}" | xargs)"
              case "${test}" in
                *[!A-Za-z0-9_/]*|"") echo "error: bad test identifier '${test}'" >&2; exit 1 ;;
              esac
              args="${args} -only-testing:${test}"
            done
            echo "running only:${args}"
          fi
          make test-ios TEST_IOS_ARGS="${args}"

      - name: Upload xcresult
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcresult
          path: .derivedData/**/*.xcresult
          if-no-files-found: warn
          # .derivedData is a dot directory; without this the glob matches nothing and no xcresult is kept.
          include-hidden-files: true
          retention-days: 14
