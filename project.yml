name: mdview
options:
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    CODE_SIGN_STYLE: Automatic
    APP_DISPLAY_NAME: YAMD
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
packages:
  # Textual 0.5.0 with one patch (link taps). See Vendor/textual/MDVIEW_PATCH.md.
  Textual:
    path: Vendor/textual
  MDCore:
    path: Packages/MDCore
targets:
  mdview:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: App/mdview
        excludes:
          - Info.plist
      - path: App/Shared
    dependencies:
      - package: Textual
        product: Textual
      - package: MDCore
        product: MDCore
      - target: mdviewShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: us.par72.mdview
        PRODUCT_NAME: mdview
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/mdview/Info.plist
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "5"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    configFiles:
      Debug: Config/Local.xcconfig
      Release: Config/Local.xcconfig
  # Share extension (K7, K9). No App Group. The bundle id is a target setting, so it wins over
  # Config/Local.xcconfig, which supplies only the team. Versions must match the app's (make lint checks).
  mdviewShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: App/mdviewShare
        excludes:
          - Info.plist
          - Info-Debug.plist
      - path: App/Shared
    dependencies:
      - package: Textual
        product: Textual
      - package: MDCore
        product: MDCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: us.par72.mdview.share
        PRODUCT_NAME: mdviewShare
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "5"
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          INFOPLIST_FILE: App/mdviewShare/Info-Debug.plist
        Release:
          INFOPLIST_FILE: App/mdviewShare/Info.plist
    configFiles:
      Debug: Config/Local.xcconfig
      Release: Config/Local.xcconfig
  mdviewUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: App/mdviewUITests
    dependencies:
      - target: mdview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: us.par72.mdview.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: mdview
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
schemes:
  mdview:
    build:
      targets:
        mdview: all
        mdviewUITests: testing
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - mdviewUITests
    archive:
      config: Release
fileGroups:
  - Config
  - Packages
